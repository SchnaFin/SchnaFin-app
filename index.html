<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchnaFin</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4fff8;color:#173b2a;text-align:center}
.app{max-width:500px;margin:auto;padding:35px 22px}
.logo{font-size:42px;font-weight:800;margin:25px 0 8px}
.subtitle{font-size:18px;margin-bottom:40px}
.camera{width:190px;height:190px;margin:auto;border:4px solid #2f9e62;border-radius:35px;background:white;display:flex;align-items:center;justify-content:center;font-size:75px}
h1{font-size:28px;margin:25px 0 10px}
p{font-size:17px;line-height:1.5;color:#50705e}
.button{display:inline-block;margin-top:15px;padding:18px 30px;background:#2f9e62;color:white;border-radius:18px;font-size:19px;font-weight:bold}
input[type="file"] {display:none}
#preview{display:none;width:100%;max-height:300px;object-fit:contain;margin-top:25px;border-radius:20px}
#analyse{display:none;margin-top:25px}
.box{background:white;border-radius:20px;padding:22px;margin-top:20px}
.text{width:100%;padding:15px;border:2px solid #cde8d8;border-radius:14px;font-size:17px}
button{border:0;cursor:pointer}
.result{display:none;margin-top:20px;background:#173b2a;color:white;border-radius:20px;padding:25px}
.price{font-size:38px;font-weight:bold;margin:10px}
</style>
</head>

<body>
<div class="app">

<div class="logo">SchnaFin</div>
<div class="subtitle">Was ist dein Artikel wirklich wert?</div>

<div class="camera">📷</div>

<h1>Artikel fotografieren</h1>
<p>Fotografiere deinen Artikel und SchnaFin hilft dir, einen fairen Preis einzuschätzen.</p>

<label class="button">
📸 Foto aufnehmen
<input id="foto" type="file" accept="image/*" capture="environment">
</label>

<img id="preview">

<div id="analyse">

<div class="box">

<h2>🤖 SchnaFin analysiert</h2>

<p id="status">Das Foto wird automatisch analysiert …</
<div class="result" id="result">
<div>SchnaFin-Einschätzung</div>
<div class="price" id="preis"></div>
<div id="beschreibung"></div>
</div>
</div>

</div>

<script>
let model;

async function ladeKI() {
  model = await mobilenet.load();
}

ladeKI();

const foto=document.getElementById("foto");

foto.onchange = async function() {

  if (!foto.files[0]) return;

  const bild = document.getElementById("preview");

  bild.src = URL.createObjectURL(foto.files[0]);
  bild.style.display = "block";

  document.getElementById("analyse").style.display = "block";

  if (!model) {
    model = await mobilenet.load();
  }

  const ergebnis = await model.classify(bild);

  const erkannt = ergebnis[0].className;

  document.getElementById("artikel").value = erkannt;

  preisBerechnen();
};

function preisBerechnen(){

let artikel=document.getElementById("artikel").value.toLowerCase();

let preis="Noch keine Einschätzung";
let text="Für diesen Artikel haben wir noch keine Vergleichsdaten.";

if(artikel.includes("ps5")){
preis="ca. 350–450 €";
text="Abhängig von Modell, Speicher, Zustand und Zubehör.";
}

else if(artikel.includes("bosch") && artikel.includes("akk")){
preis="ca. 50–100 €";
text="Abhängig von Modell, Akku, Ladegerät und Zustand.";
}

else if(artikel.includes("iphone")){
preis="ca. 300–700 €";
text="Abhängig von Modell, Speicher und Zustand.";
}

document.getElementById("preis").innerText=preis;
document.getElementById("beschreibung").innerText=text;
document.getElementById("result").style.display="block";
}
</script>

</body>
</html>
